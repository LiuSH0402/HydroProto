run_name: hydroproto
model: hydrompc_v2  # Internal legacy model kind; public model name is HydroProto.
train_embeddings: modeling/embeddings/train_esm2_t30_150M.npz
test_embeddings: modeling/embeddings/test_esm2_t30_150M.npz
train_csv: random_split_similarity_audit/train_dataset.csv
test_csv: random_split_similarity_audit/test_dataset.csv
nested_dir: random_split_similarity_audit
seed: 42
val_fraction: 0.10
epochs: 150
patience: 20
batch_samples_per_class: 8
learning_rate: 0.001
weight_decay: 0.0001
dropout: 0.20
label_smoothing: 0.05
hidden_dim: 512
feature_dim: 256
projection_dim: 128
local_supcon: false
local_knn: 10
local_mutual_knn: true
supcon_weight: 0.0
temperature: 0.10
online_prototypes: true
prototype_warmup_epochs: 15
prototype_loss_weight: 0.10
prototype_diversity_weight: 0.01
prototype_diversity_margin: 0.30
num_prototypes: 5
fusion_alpha: 0.0
prototype_temperature: 0.10
