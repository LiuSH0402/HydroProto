[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydroproto"
version = "0.2.0"
description = "Prototype-guided ESM-2 models for bacterial hydrolase multiclass classification"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
  "torch>=2.6,<3",
  "transformers>=4.49,<5",
  "accelerate>=0.26,<2",
  "tqdm>=4.67,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.9,<4", "seaborn>=0.13,<1"]
embedding = ["fair-esm==2.0.0", "biopython>=1.85,<2"]
test = ["pytest>=8,<9"]

[project.scripts]
hydroproto = "hydroproto.cli:main"

[tool.setuptools]
packages = ["hydroproto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
